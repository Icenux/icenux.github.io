  <header class="site-header" id="siteHeader">
    <div class="container nav">
      <a class="brand" href="/" aria-label="Icenux home">
        <img class="brand__mark" src="/icenux-logo.svg" alt="" width="64" height="64">
        <span class="brand__word">icenux</span>
      </a>

      <nav class="nav__links" id="navLinks" aria-label="Primary">
        {% for item in site.data.nav -%}
        <a href="{{ item.url }}"{% if page.nav == item.id %} class="is-active" aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor -%}
      </nav>

      <div class="nav__actions">
        <button class="search-btn" id="searchOpen" type="button" aria-label="Search the site" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="search-btn__label">Search</span>
          <kbd class="search-btn__kbd">⌘K</kbd>
        </button>
        <a class="icon-btn nav__github" href="https://github.com/icenux" target="_blank" rel="noopener" aria-label="Icenux on GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z" fill="currentColor"/></svg>
        </a>
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>
