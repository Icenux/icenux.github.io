name: Pages

# Builds the Jekyll site, checks it and deploys it to GitHub Pages.
# Repository settings -> Pages -> Source must be "GitHub Actions".
#
# Besides every push, it runs daily: scripts/update-versions.py pulls the latest release of each app
# and commits changed versions to _data/apps.yml, so the site never shows a stale version.
# (GitHub disables scheduled workflows after 60 days without repository activity — re-enable
# it in the Actions tab or run it by hand if that ever happens.)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh app versions from GitHub releases
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update-versions.py
          if ! git diff --quiet -- _data/apps.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/apps.yml
            git commit -m "chore: sync app versions from GitHub releases"
            git push
          fi

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # Internal links, anchors and images only; external URLs are skipped so a third-party
      # outage cannot block a deploy.
      - name: Check HTML and internal links
        run: |
          gem install html-proofer --no-document
          htmlproofer ./_site --disable-external --no-enforce-https

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
