name: Pages

# Builds the Jekyll site, checks it and deploys it to GitHub Pages.
# Repository settings -> Pages -> Source must be "GitHub Actions".
#
# Besides every push, it runs daily so the site picks up new app releases on its own
# (scripts/update-versions.py reads the latest release of each app during the build).
# Actions are pinned to a commit SHA (the tag it came from is in the comment); Dependabot proposes
# updates. (GitHub disables scheduled workflows after 60 days without repository activity — re-enable
# it in the Actions tab or run it by hand if that ever happens.)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  # Sent by the release workflows of the apps (secret SITE_DISPATCH_TOKEN) so a new version shows up at once.
  repository_dispatch:
    types: [app-released]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Versions come straight from the latest GitHub releases on every build, so the live site is
      # current without committing to the protected main branch. _data/apps.yml in the repository
      # may lag behind; run `python3 scripts/update-versions.py` locally to commit fresh values.
      - name: Refresh app versions from GitHub releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-versions.py

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages

      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: "3.3"

      # Internal links, anchors and images only; external URLs are skipped so a third-party
      # outage cannot block a deploy.
      - name: Check HTML and internal links
        run: |
          gem install html-proofer --no-document
          htmlproofer ./_site --disable-external --no-enforce-https

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
